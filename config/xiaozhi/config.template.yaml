# xiaozhi-esp32-server 用の上書き設定テンプレート（最小構成）。
# 起動時に render_config.py が「${大文字の変数名}」を .env の値で展開し data/.config.yaml を生成する。
# 本体の config.yaml に deep merge されるので、変えたいキーだけ書く。
# キー名の根拠: okf/services/xiaozhi-esp32-server.md

server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  # OTA が端末に返す WebSocket URL。Docker 内からは LAN IP が分からないので明示する。
  # 端末は brain（8010）に繋ぎ、brain が xiaozhi-server（8000）へ中継する（okf/decisions/007）
  websocket: ws://${SERVER_LAN_IP}:8010/xiaozhi/v1/
  vision_explain: http://${SERVER_LAN_IP}:8003/mcp/vision/explain
  timezone_offset: +9
  auth:
    enabled: false

prompt: |
  あなたはスタックチャンという名前の小さな卓上ロボットです。
  日本語で、短く、親しみやすく話します。一度に話すのは1〜2文までにしてください。
  【最重要】返答・ツール引数の文章は、相手の言語や会話履歴の言語にかかわらず必ず日本語で書くこと。
  会話履歴に中国語の例が含まれていても、それは形式の例にすぎず、あなたは中国語を使わない。
  「嘿，你好呀」のような中国語の呼びかけは、ユーザーがあなたを呼んだ合図なので、日本語であいさつを返す。

# LLM 失敗時に読み上げる定型文（デフォルトは中国語）
system_error_response: "ごめんね、いまちょっと調子が悪いみたい。あとでもう一回話しかけてね。"

# ウェイクワード。端末が検出時に listen/detect で送る文字列（StackChan は "Hi,Stack Chan"）や
# 音声認識結果を、句読点・空白を除いた完全一致で照合する（okf/services/xiaozhi-esp32-server.md）
wakeup_words:
  - HiStackChan
  - スタックチャン
  - ハイスタックチャン
# ウェイクワード応答キャッシュは中国語の固定フレーズを読み上げるので使わない
enable_wakeup_words_response_cache: false

# 無音がこの秒数続くとサーバーが切断する（デフォルト 120）。自律発話の検証のため .env で変えられるようにしている
close_connection_no_voice_time: ${XIAOZHI_NO_VOICE_CLOSE_SEC}

# 発話の終わりとみなす無音の長さ（ミリ秒）。本体の既定 200 では日本語の息継ぎや言いよどみで文が細切れになる
# （2026-09-27 実機）。長くすると、話し終えてから返事が始まるまでもその分遅れる
VAD:
  SileroVAD:
    min_silence_duration_ms: ${XIAOZHI_VAD_SILENCE_MS}

# 無音タイムアウトで切る時に LLM へ送るお別れ指示（デフォルトは中国語）。自律発話では不要なので切る
end_prompt:
  enable: false

# 完全一致で接続を閉じる言葉（デフォルトは中国語）
exit_commands:
  - 終了
  - おしまい

selected_module:
  VAD: SileroVAD
  ASR: FunASR
  LLM: GatewayLLM
  VLLM: GatewayVLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: function_call

Intent:
  function_call:
    # 追加で読み込むサーバープラグイン。デフォルトの中国向けプラグイン（ニュース・天気・Web検索・
    # 役割切替・音楽）は外す。handle_exit_intent と get_lunar は本体が常に読み込む。
    # 端末 MCP ツール（首・LED）はこのリストとは別に、端末接続時に自動で登録される
    functions: []

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    language: ja

LLM:
  GatewayLLM:
    # Vercel AI Gateway の OpenAI 互換 API を llm-proxy 経由で呼ぶ（okf/external/vercel-ai-gateway.md）
    # 実キーは llm-proxy が付与するので、ここの api_key はダミー
    type: openai
    base_url: http://llm-proxy:8080/v1
    model_name: ${LLM_MODEL}
    api_key: via-llm-proxy
    # temperature / top_p は推論モデルでの扱いが未確認のため指定しない
    max_tokens: 300

VLLM:
  GatewayVLLM:
    # LLM が take_photo で撮った写真の説明（「何が見える？」）。llm-proxy 経由で Gateway の Luna を使う
    type: openai
    base_url: http://llm-proxy:8080/v1
    model_name: ${LLM_MODEL}
    api_key: via-llm-proxy

TTS:
  EdgeTTS:
    type: edge
    voice: ja-JP-NanamiNeural
    output_dir: tmp/
    # {{language}} としてシステムプロンプトに入り、応答言語を指示する
    language: Japanese (日本語)
