# stackchan-brain
# xiaozhi-server + llm-proxy + brain。mcp-bridge は M4 で追加する。
# LLM・Jev はすべて Vercel AI Gateway 経由（okf/decisions/008-llm-via-vercel-gateway.md）。
# 設定の根拠: okf/services/xiaozhi-esp32-server.md、手順: okf/runbooks/server-startup.md

services:
  xiaozhi-server:
    # 本体は改変せず公式イメージに依存する（CLAUDE.md 原則1）。arm64 / amd64 両対応
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_0.9.6
    container_name: xiaozhi-esp32-server
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: Asia/Tokyo
      SERVER_LAN_IP: ${SERVER_LAN_IP:?SERVER_LAN_IP を .env に設定してください}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-6-luna}
      XIAOZHI_NO_VOICE_CLOSE_SEC: ${XIAOZHI_NO_VOICE_CLOSE_SEC:-600}
    depends_on:
      llm-proxy:
        condition: service_healthy
    # .env の値でテンプレートを展開してから本体を起動する
    command: ["sh", "-c", "python /opt/stackchan/render_config.py && exec python app.py"]
    ports:
      - "8000:8000"   # WebSocket /xiaozhi/v1/
      - "8003:8003"   # HTTP: OTA /xiaozhi/ota/、視覚解析
    volumes:
      - ./config/xiaozhi/config.template.yaml:/opt/stackchan/config.template.yaml:ro
      - ./config/xiaozhi/render_config.py:/opt/stackchan/render_config.py:ro
      - ./data/xiaozhi:/opt/xiaozhi-esp32-server/data
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/xiaozhi/ota/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  llm-proxy:
    # reasoning_effort の注入と Gateway キーの付与だけを行う中継（llm-proxy/proxy.py）。
    # 追加ビルドを避けるため aiohttp 同梱の xiaozhi-server イメージで実行する
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_0.9.6
    container_name: llm-proxy
    restart: unless-stopped
    entrypoint: ["python", "/opt/llm-proxy/proxy.py"]
    environment:
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?AI_GATEWAY_API_KEY を .env に設定してください}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      LLM_PROXY_LOG_BODY: ${LLM_PROXY_LOG_BODY:-0}
      # Jev の呼び先: gateway（Vercel AI Gateway）/ typesafe（TypeSafe 直接、TYPESAFE_API_KEY が必要）
      JEV_BACKEND: ${JEV_BACKEND:-gateway}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # 宛先ゲート（GitHub #2）: ユーザー発話を Jev で分類し、LLM を呼ぶか決める
      LLM_GATE_ENABLED: ${LLM_GATE_ENABLED:-1}
      LLM_GATE_RECORD_DIR: /data/gate
    volumes:
      - ./llm-proxy/proxy.py:/opt/llm-proxy/proxy.py:ro
      - ./llm-proxy/rewrites.py:/opt/llm-proxy/rewrites.py:ro
      - ./llm-proxy/jev.py:/opt/llm-proxy/jev.py:ro
      - ./llm-proxy/gate.py:/opt/llm-proxy/gate.py:ro
      - ./llm-proxy/speech_filter.py:/opt/llm-proxy/speech_filter.py:ro
      - ./data/llm-proxy:/data
    # ポートは公開しない（compose ネットワーク内の xiaozhi-server からだけ使う）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  brain:
    # 端末 ⇔ xiaozhi-server の WebSocket 中継（okf/decisions/007-proactive-speech-path.md）。
    # xiaozhi-server の server.websocket をここ（8010）に向けると、OTA 経由で端末がここに繋ぐ
    build: ./brain
    container_name: brain
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      BRAIN_UPSTREAM_WS: ws://xiaozhi-server:8000/xiaozhi/v1/
      BRAIN_SESSION_LOG_DIR: /data/sessions
      BRAIN_JUDGMENT_DIR: /data/judgments
      BRAIN_CAMERA_DIR: /data/camera
      # 端末の take_photo の送り先を brain に向ける（端末から見える LAN の URL）
      BRAIN_VISION_URL: http://${SERVER_LAN_IP}:8012/vision/explain
      BRAIN_JUDGE_ENABLED: ${BRAIN_JUDGE_ENABLED:-1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-6-luna}
    ports:
      - "8010:8010"   # 端末からの WebSocket（LAN 内のみ）
      - "127.0.0.1:8011:8011"   # 操作 API（/sessions、/say）。この Mac からだけ使う
      - "8012:8012"   # 端末カメラの写真の受け口（LAN 内のみ）
    volumes:
      - ./data/brain:/data
      - ./evals:/evals:ro
    depends_on:
      xiaozhi-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # mcp-bridge:   # M4: option-quants 等を MCP 接続点に繋ぐ（mcp/）
